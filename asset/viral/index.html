<script>
window.demoReady = new Promise((resolve, reject) => {
  document.getElementById('site').addEventListener('load', async () => {
    try {
      const w = document.getElementById('site').contentWindow;
      for (const file of ['src/i18n/messages.js','src/i18n/i18n.js','src/core/context.js','src/core/signals.js','src/prose/english-rules.js', 'src/prose/prose.js', 'src/core/score.js','src/scan/scan.js']) {
        await new Promise((yes,no) => { const s=w.document.createElement('script');s.src='/'+file;s.onload=yes;s.onerror=no;w.document.head.append(s); });
      }
      window.scanDemo = locale => { window.demoReport=w.BAMTI.scan(locale);return window.demoReport; };
      resolve();
    } catch(error) { reject(error); }
  });
});
</script></body></html>
